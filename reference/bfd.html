    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const createCarouselControls = (carouselId, prevId, nextId) => {
                const carouselContainer = document.getElementById(carouselId);
                const prevButton = document.getElementById(prevId);
                const nextButton = document.getElementById(nextId);
                const cards = carouselContainer.querySelectorAll('.card-slider-component');

                function updateButtonVisibility() {
                    const maxScrollLeft = carouselContainer.scrollWidth - carouselContainer.clientWidth;
                    const isMobile = window.innerWidth < 767;

                    if (!isMobile) {
                        if (carouselContainer.scrollLeft > 0) {
                            prevButton.style.display = 'block';
                        } else {
                            prevButton.style.display = 'none';
                        }

                        if (carouselContainer.scrollLeft + 1 < maxScrollLeft) {
                            nextButton.style.display = 'block';
                        } else {
                            nextButton.style.display = 'none';
                        }
                    } else {
                        prevButton.style.display = 'none';
                        nextButton.style.display = 'none';
                    }
                }

                function getVisibleCards() {
                    const containerWidth = carouselContainer.clientWidth;
                    let visibleCards = 0;
                    let totalWidth = 0;

                    for (const card of cards) {
                        totalWidth += card.offsetWidth + parseInt(window.getComputedStyle(card).marginRight);
                        if (totalWidth <= containerWidth) {
                            visibleCards++;
                        } else {
                            break;
                        }
                    }

                    return visibleCards;
                }

                nextButton.addEventListener('click', () => {
                    const visibleCards = getVisibleCards();
                    const cardWidth = cards[0].offsetWidth + parseInt(window.getComputedStyle(cards[0]).marginRight);
                    carouselContainer.scrollBy({ left: cardWidth * visibleCards, behavior: 'smooth' });
                    setTimeout(updateButtonVisibility, 500);
                });

                prevButton.addEventListener('click', () => {
                    const visibleCards = getVisibleCards();
                    const cardWidth = cards[0].offsetWidth + parseInt(window.getComputedStyle(cards[0]).marginRight);
                    carouselContainer.scrollBy({ left: -cardWidth * visibleCards, behavior: 'smooth' });
                    setTimeout(updateButtonVisibility, 500);
                });

                carouselContainer.addEventListener('scroll', updateButtonVisibility);
                window.addEventListener('resize', updateButtonVisibility);

                updateButtonVisibility();
            };

            createCarouselControls('trending-carousel-items-BFD', 'imageSlidingRec-prev', 'imageSlidingRec-next');
        });
    </script>
